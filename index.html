<h2>NU.SY2025-26.3T</h2>

<label for="section">Select Course-Section:</label>
<select id="section">
  <option value="">-- Select Course-Section --</option>
  <option value="ENDCAL30-BSCE251P">ENDCAL30-BSCE251P</option>
  <option value="CEDYNA20-BSCE241P1">CEDYNA20-BSCE241P1</option>
  <option value="CEDYNA20-BSCE241P2">CEDYNA20-BSCE241P2</option>
</select>
<br><br>

<label for="studentNumber">Student Number:</label>
<input type="text" id="studentNumber" placeholder="Enter student number">
<br><br>

<button onclick="fetchScores()">View Scores and Running Grade</button>

<hr>

<div id="output"></div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwiQhH6KNy_Pc0jVHtfjdQZjdZOiDM4JlhLIFtyMuOSzE1K4Z2ugCZwPnh0KA-2_yOxlQ/exec";
async function fetchScores() {
    const section = document.getElementById("section").value;
    const studentNumber = document.getElementById("studentNumber").value.trim();

    // Clear display area
    document.getElementById("output").innerHTML = "";

    // Validate inputs
    if (!section) {
        document.getElementById("output").innerHTML = "<p style='color:red;'>Please select a section.</p>";
        return;
    }
    if (!studentNumber) {
        document.getElementById("output").innerHTML = "<p style='color:red;'>Please enter your student number.</p>";
        return;
    }

    // Build request URL
    const url = `${API_URL}?section=${encodeURIComponent(section)}&student=${encodeURIComponent(studentNumber)}`;

    try {
        const response = await fetch(url);
        const data = await response.json();

        // If API returned an error
        if (data.error) {
            document.getElementById("output").innerHTML =
                `<p style='color:red;'>${data.error}</p>`;
            return;
        }

        // Build table of results
        let html = "<table border='1' cellpadding='8' style='border-collapse:collapse;'>";
        html += "<tr><th>Field</th><th>Value</th></tr>";

        for (let key in data) {
            html += `<tr><td>${key}</td><td>${data[key]}</td></tr>`;
        }

        html += "</table>";

        document.getElementById("output").innerHTML = html;

    } catch (err) {
        document.getElementById("output").innerHTML =
            "<p style='color:red;'>Error fetching data. Please try again.</p>";
        console.error(err);
    }
}
</script>
